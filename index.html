<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨時量詞大冒險 Temporary Classifiers Game</title>
    <style>
        :root {
            --primary-bg: #e0f7fa;
            --bubble-target: #ff80ab;
            --bubble-item: #80deea;
            --text-color: #004d40;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header UI */
        #game-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #timer { color: #d32f2f; }

        /* Game Canvas Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* Target Big Bubble */
        #target-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff80ab, #c2185b);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 0 15px rgba(255,255,255,0.6);
            z-index: 5;
            animation: pulse 2s infinite ease-in-out;
            overflow: hidden;
        }

        #target-bubble .label { font-size: 0.85rem; opacity: 0.9; }
        #target-bubble .word { font-size: 2.2rem; font-weight: bold; }
        #target-bubble img.target-pic {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        /* Floating Small Picture Bubbles */
        .bubble {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85); 
            border: 3px solid rgba(178, 235, 242, 0.8);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15), inset -2px -2px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 2;
            overflow: hidden;
        }

        .bubble-img {
            width: 75%;
            height: 75%;
            object-fit: contain;
            pointer-events: none;
        }

        .bubble:active {
            transform: scale(0.9);
        }

        .bubble.pop {
            animation: popAnimation 0.3s forwards;
            pointer-events: none;
        }

        @keyframes popAnimation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Modal / Overlay screens */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 520px;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-content h2 { color: #00796b; margin-top: 0; }

        .select-group {
            margin: 15px 0;
            text-align: left;
        }

        .select-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #004d40;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #e0f2f1;
            border: 2px solid #80cbc4;
            color: #004d40;
            padding: 10px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.selected {
            background: #00897b;
            color: white;
            border-color: #004d40;
        }

        .level-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .summary-card {
            background: #e0f2f1;
            color: #004d40;
            padding: 10px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }

        .summary-card img { width: 35px; height: 35px; object-fit: contain; }

        .btn {
            background: #00897b;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .btn:hover { background: #00695c; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Top UI Container -->
    <div id="game-header">
        <div class="stat-box">回合 Round: <span id="round-num">1</span>/<span id="max-rounds">1</span></div>
        <div class="stat-box">得分 Score: <span id="score">0</span></div>
        <div class="stat-box">時間 Time: <span id="timer">30</span>s</div>
    </div>

    <!-- Play Field -->
    <div id="game-container">
        <!-- Target Big Bubble -->
        <div id="target-bubble">
            <span class="label">目標量詞</span>
            <span class="word" id="target-word">碗</span>
            <img id="target-img" class="target-pic hidden" src="" alt="Target Item">
        </div>
    </div>

    <!-- Pre-selection / Start Modal -->
    <div id="start-modal" class="modal">
        <div class="modal-content">
            <h2>臨時量詞圖片大冒險</h2>

            <!-- 1. Select Classifier -->
            <div class="select-group">
                <label>1. 選擇目標量詞 (Select Classifier):</label>
                <div class="options-grid" id="classifier-options">
                    <button class="option-btn selected" onclick="selectClassifier('碗', this)">碗</button>
                    <button class="option-btn" onclick="selectClassifier('杯', this)">杯</button>
                    <button class="option-btn" onclick="selectClassifier('碟', this)">碟</button>
                    <button class="option-btn" onclick="selectClassifier('袋', this)">袋</button>
                    <button class="option-btn" onclick="selectClassifier('盒', this)">盒</button>
                    <button class="option-btn" onclick="selectClassifier('箱', this)">箱</button>
                </div>
            </div>

            <!-- 2. Select Level Mode -->
            <div class="select-group">
                <label>2. 選擇難度關卡 (Select Level):</label>
                <div class="level-grid" id="level-options">
                    <button class="option-btn selected" onclick="selectLevel(1, this)">
                        Level 1<br><small style="font-size:0.8rem;">文字目標 (30秒/1回合)</small>
                    </button>
                    <button class="option-btn" onclick="selectLevel(2, this)">
                        Level 2<br><small style="font-size:0.8rem;">配對目標圖 (10秒/3回合)</small>
                    </button>
                </div>
            </div>

            <button class="btn" onclick="startGame()">開始遊戲 Start</button>
        </div>
    </div>

    <!-- Round / Game Summary Overlay -->
    <div id="summary-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="summary-title">練習完成！</h2>
            <p>目標量詞「<span id="summary-target" style="font-weight:bold; color:#c2185b;"></span>」的常見圖文搭配：</p>
            <div class="summary-grid" id="summary-grid"></div>
            <button class="btn" onclick="restartToMenu()">返回主選單 Menu</button>
        </div>
    </div>

    <script>
        const gameData = [
            {
                classifier: '碗',
                items: [
                    { name: '一碗草莓', imgUrl: '12.png' },
                    { name: '一碗麵', imgUrl: '13.png' },
                    { name: '一碗飯', imgUrl: '14.png' },
                    { name: '一碗沙律', imgUrl: '15.png' },
                    { name: '一碗粟米片', imgUrl: '16.png' },
                    { name: '一碗蔬菜', imgUrl: '17.png' },
                    { name: '一碗糖', imgUrl: '18.png' },
                    { name: '一碗湯', imgUrl: '19.png' },
                    { name: '一碗飯', imgUrl: '20.png' },
                    { name: '一碗湯', imgUrl: '21.png' }
                ]
            },
            {
                classifier: '杯',
                items: [
                    { name: '一杯朱古力', imgUrl: '22.png' },
                    { name: '一杯茶', imgUrl: '23.png' },
                    { name: '一杯水', imgUrl: '24.png' },
                    { name: '一杯牛奶', imgUrl: '25.png' },
                    { name: '一杯檸檬汁', imgUrl: '26.png' },
                    { name: '一杯橙汁', imgUrl: '27.png' },
                    { name: '一杯可樂', imgUrl: '28.png' },
                    { name: '一杯蘋果汁', imgUrl: '29.png' },
                    { name: '一杯雪糕', imgUrl: '30.png' },
                    { name: '一杯水', imgUrl: '31.png' }
                ]
            },
            {
                classifier: '碟',
                items: [
                    { name: '一碟飯', imgUrl: '32.png' },
                    { name: '一碟肉', imgUrl: '33.png' },
                    { name: '一碟餃子', imgUrl: '34.png' },
                    { name: '一碟曲奇餅', imgUrl: '35.png' },
                    { name: '一碟炒飯', imgUrl: '36.png' },
                    { name: '一碟炒麵', imgUrl: '37.png' },
                    { name: '一碟冬甩', imgUrl: '38.png' },
                    { name: '一碟意粉', imgUrl: '39.png' },
                    { name: '一碟壽司', imgUrl: '40.png' },
                    { name: '一碟三文治', imgUrl: '41.png' }
                ]
            },
            {
                classifier: '袋',
                items: [
                    { name: '一袋禮物', imgUrl: '42.png' },
                    { name: '一袋玩具', imgUrl: '43.png' },
                    { name: '一袋麵包', imgUrl: '44.png' },
                    { name: '一袋波子', imgUrl: '45.png' },
                    { name: '一袋蘋果', imgUrl: '46.png' },
                    { name: '一袋垃圾', imgUrl: '47.png' },
                    { name: '一袋菜', imgUrl: '48.png' },
                    { name: '一袋錢', imgUrl: '49.png' },
                    { name: '一袋糖', imgUrl: '50.png' },
                    { name: '一袋曲奇餅', imgUrl: '51.png' }
                ]
            },
            {
                classifier: '箱',
                items: [
                    { name: '一箱玩具', imgUrl: '52.png' },
                    { name: '一箱雜物', imgUrl: '53.png' },
                    { name: '一箱書', imgUrl: '54.png' },
                    { name: '一箱食物', imgUrl: '55.png' },
                    { name: '一箱文具', imgUrl: '56.png' },
                    { name: '一箱蔬果', imgUrl: '57.png' },
                    { name: '一箱水果', imgUrl: '58.png' },
                    { name: '一箱飲品', imgUrl: '59.png' },
                    { name: '一箱衣服', imgUrl: '60.png' },
                    { name: '一箱食物', imgUrl: '61.png' }
                ]
            },
            {
                classifier: '盒',
                items: [
                    { name: '一盒草莓', imgUrl: '62.png' },
                    { name: '一盒冬甩', imgUrl: '63.png' },
                    { name: '一盒雞蛋', imgUrl: '64.png' },
                    { name: '一盒粟米片', imgUrl: '65.png' },
                    { name: '一盒蘋果汁', imgUrl: '66.png' },
                    { name: '一盒紙巾', imgUrl: '67.png' },
                    { name: '一盒朱古力', imgUrl: '68.png' },
                    { name: '一盒顏色筆', imgUrl: '69.png' },
                    { name: '一盒牛奶', imgUrl: '70.png' },
                    { name: '一盒飯', imgUrl: '71.png' }
                ]
            }
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let selectedClassifierName = '碗';
        let selectedLevel = 1;

        let currentRound = 1;
        let maxRounds = 1;
        let score = 0;
        let timeLeft = 30;
        let timerInterval = null;
        let animationFrameId = null;
        let activeBubbles = [];
        let targetsRemaining = 0;
        let currentTargetGroupData = null;
        let currentLevel2TargetItem = null;

        function shuffle(array) { return array.slice().sort(() => Math.random() - 0.5); }

        function selectClassifier(classifier, btn) {
            selectedClassifierName = classifier;
            const container = document.getElementById('classifier-options');
            container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function selectLevel(level, btn) {
            selectedLevel = level;
            const container = document.getElementById('level-options');
            container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            score = 0;
            currentRound = 1;
            maxRounds = (selectedLevel === 1) ? 1 : 3;

            document.getElementById('score').innerText = score;
            document.getElementById('max-rounds').innerText = maxRounds;

            currentTargetGroupData = gameData.find(d => d.classifier === selectedClassifierName);

            setupRound();
        }

        function restartToMenu() {
            document.getElementById('summary-modal').classList.add('hidden');
            document.getElementById('start-modal').classList.remove('hidden');
        }

        function setupRound() {
            const container = document.getElementById('game-container');
            document.querySelectorAll('.bubble').forEach(b => b.remove());
            activeBubbles = [];

            document.getElementById('round-num').innerText = currentRound;

            const targetWordEl = document.getElementById('target-word');
            const targetImgEl = document.getElementById('target-img');

            let roundItems = [];

            if (selectedLevel === 1) {
                // LEVEL 1: Text Target, 5 Targets + 10 Distractors, 30 Seconds, 1 Round
                targetWordEl.classList.remove('hidden');
                targetImgEl.classList.add('hidden');
                targetWordEl.innerText = currentTargetGroupData.classifier;

                const correctPool = shuffle(currentTargetGroupData.items);
                const targets = correctPool.slice(0, 5).map(item => ({ ...item, isTarget: true }));
                
                let distractorPool = [];
                gameData.forEach(data => {
                    if (data.classifier !== selectedClassifierName) {
                        distractorPool = distractorPool.concat(data.items);
                    }
                });
                const distractors = shuffle(distractorPool).slice(0, 10).map(item => ({ ...item, isTarget: false }));
                
                roundItems = shuffle([...targets, ...distractors]);
                targetsRemaining = 5;
                timeLeft = 30;

            } else {
                // LEVEL 2: Picture Target, 1 Target Picture + 14 Random Distractors, 10 Seconds, 3 Rounds
                targetWordEl.classList.add('hidden');
                targetImgEl.classList.remove('hidden');

                // Pick 1 target picture from target group
                const targetPool = shuffle(currentTargetGroupData.items);
                currentLevel2TargetItem = targetPool[0];
                targetImgEl.src = currentLevel2TargetItem.imgUrl;
                targetImgEl.alt = currentLevel2TargetItem.name;

                const targetItemObj = { ...currentLevel2TargetItem, isTarget: true };

                let distractorPool = [];
                gameData.forEach(data => {
                    if (data.classifier !== selectedClassifierName) {
                        distractorPool = distractorPool.concat(data.items);
                    }
                });
                const distractors = shuffle(distractorPool).slice(0, 14).map(item => ({ ...item, isTarget: false }));

                roundItems = shuffle([targetItemObj, ...distractors]);
                targetsRemaining = 1;
                timeLeft = 10;
            }

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            roundItems.forEach((item) => {
                const bubbleEl = document.createElement('div');
                bubbleEl.className = 'bubble';

                const imgEl = document.createElement('img');
                imgEl.className = 'bubble-img';
                imgEl.src = item.imgUrl;
                imgEl.alt = item.name;

                bubbleEl.appendChild(imgEl);

                const radius = 55;
                let x = Math.random() * (containerWidth - radius * 2) + radius;
                let y = Math.random() * (containerHeight - radius * 2 - 160) + radius + 140;

                bubbleEl.style.left = `${x - radius}px`;
                bubbleEl.style.top = `${y - radius}px`;

                container.appendChild(bubbleEl);

                const bubbleObj = {
                    element: bubbleEl,
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: radius,
                    isTarget: item.isTarget,
                    popped: false
                };

                bubbleEl.addEventListener('pointerdown', () => popBubble(bubbleObj));
                activeBubbles.push(bubbleObj);
            });

            document.getElementById('timer').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            updatePhysics();
        }

        function popBubble(bubbleObj) {
            if (bubbleObj.popped) return;
            bubbleObj.popped = true;
            bubbleObj.element.classList.add('pop');

            if (bubbleObj.isTarget) {
                playSound('pop');
                score += 10; 
                targetsRemaining--;
                document.getElementById('score').innerText = score;

                if (targetsRemaining === 0) endRound();
            } else {
                playSound('wrong');
                score = Math.max(0, score - 5);
                document.getElementById('score').innerText = score;
            }
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endRound();
        }

        function updatePhysics() {
            const container = document.getElementById('game-container');
            const width = container.clientWidth;
            const height = container.clientHeight;
            activeBubbles.forEach(b => {
                if (b.popped) return;
                b.x += b.vx; b.y += b.vy;
                if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -1; }
                if (b.x + b.radius > width) { b.x = width - b.radius; b.vx *= -1; }
                if (b.y - b.radius < 130) { b.y = 130 + b.radius; b.vy *= -1; }
                if (b.y + b.radius > height) { b.y = height - b.radius; b.vy *= -1; }
                b.element.style.left = `${b.x - b.radius}px`;
                b.element.style.top = `${b.y - b.radius}px`;
            });
            animationFrameId = requestAnimationFrame(updatePhysics);
        }

        function endRound() {
            clearInterval(timerInterval);
            cancelAnimationFrame(animationFrameId);

            if (currentRound < maxRounds) {
                currentRound++;
                setupRound();
            } else {
                showFinalSummary();
            }
        }

        function showFinalSummary() {
            const summaryGrid = document.getElementById('summary-grid');
            summaryGrid.innerHTML = '';
            
            document.getElementById('summary-target').innerText = currentTargetGroupData.classifier;
            currentTargetGroupData.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'summary-card';
                card.innerHTML = `<img src="${item.imgUrl}" alt="${item.name}"> <span>${item.name}</span>`;
                summaryGrid.appendChild(card);
            });

            document.getElementById('summary-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
