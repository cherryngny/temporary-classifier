<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨時量詞大冒險 Temporary Classifiers Game</title>
    <style>
        :root {
            --primary-bg: #e0f7fa;
            --bubble-target: #ff80ab;
            --bubble-item: #80deea;
            --text-color: #004d40;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header UI */
        #game-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #timer { color: #d32f2f; }

        /* Game Canvas Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* Target Big Bubble */
        #target-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff80ab, #c2185b);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 0 15px rgba(255,255,255,0.6);
            z-index: 5;
            animation: pulse 2s infinite ease-in-out;
        }

        #target-bubble .label { font-size: 0.9rem; opacity: 0.9; }
        #target-bubble .word { font-size: 2.2rem; font-weight: bold; }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        /* Floating Small Bubbles */
        .bubble {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #80deea);
            border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset -2px -2px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            font-weight: bold;
            color: #006064;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 2;
        }

        .bubble:active {
            transform: scale(0.9);
        }

        .bubble.pop {
            animation: popAnimation 0.3s forwards;
            pointer-events: none;
        }

        @keyframes popAnimation {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Modal / Overlay screens */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-content h2 { color: #00796b; margin-top: 0; }

        .summary-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .summary-tag {
            background: #e0f2f1;
            color: #004d40;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .btn {
            background: #00897b;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .btn:hover { background: #00695c; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Top UI Container -->
    <div id="game-header">
        <div class="stat-box">回合 Round: <span id="round-num">1</span>/5</div>
        <div class="stat-box">得分 Score: <span id="score">0</span></div>
        <div class="stat-box">時間 Time: <span id="timer">15</span>s</div>
    </div>

    <!-- Play Field -->
    <div id="game-container">
        <!-- Target Bubble -->
        <div id="target-bubble">
            <span class="label">目標量詞</span>
            <span class="word" id="target-word">碗</span>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-modal" class="modal">
        <div class="modal-content">
            <h2>臨時量詞大冒險</h2>
            <p>看清大氣泡顯示的目標量詞！<br>在 <b>15 秒</b> 內戳破所有屬於該量詞的物體氣泡！</p>
            <button class="btn" onclick="startGame()">開始遊戲 Start</button>
        </div>
    </div>

    <!-- Round Summary Overlay -->
    <div id="summary-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="summary-title">回合結束！</h2>
            <p>目標量詞「<span id="summary-target" style="font-weight:bold; color:#c2185b;"></span>」的常見組合有：</p>
            <div class="summary-list" id="summary-list"></div>
            <button class="btn" onclick="nextRound()">下一關 Next Round</button>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameover-modal" class="modal hidden">
        <div class="modal-content">
            <h2>遊戲完成！</h2>
            <p>你的最終得分是：</p>
            <h1 id="final-score" style="color: #00796b; font-size: 3rem; margin: 10px 0;">0</h1>
            <button class="btn" onclick="restartGame()">再玩一次 Play Again</button>
        </div>
    </div>

    <script>
        // Database: 5 Target Classifiers with 10 correct items each
        const gameData = [
            {
                classifier: '碗',
                items: ['一碗飯', '一碗湯', '一碗麵', '一碗粥', '一碗糖水', '一碗雪糕', '一碗麥片', '一碗餛飩', '一碗涼粉', '一碗沙律']
            },
            {
                classifier: '杯',
                items: ['一杯雪糕', '一杯橙汁', '一杯牛奶', '一杯咖啡', '一杯熱茶', '一杯可樂', '一杯水', '一杯奶茶', '一杯果汁', '一杯檸檬水']
            },
            {
                classifier: '碟',
                items: ['一碟意粉', '一碟炒飯', '一碟小菜', '一碟點心', '一碟水餃', '一碟水果', '一碟沙律', '一碟餅乾', '一碟薯條', '一碟芽菜']
            },
            {
                classifier: '袋',
                items: ['一袋橙', '一袋米', '一袋垃圾', '一袋蘋果', '一袋土豆', '一袋零食', '一袋麵包', '一袋衣服', '一袋書本', '一袋文具']
            },
            {
                classifier: '盒',
                items: ['一盒朱古力', '一盒牛奶', '一盒紙巾', '一盒餅乾', '一盒月餅', '一盒便當', '一盒雞蛋', '一盒火柴', '一盒彩色筆', '一盒豆腐']
            }
        ];

        // Web Audio API Sound Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Game State Variables
        let currentRound = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval = null;
        let animationFrameId = null;
        let activeBubbles = [];
        let targetsRemaining = 0;
        let currentTargetData = null;

        // Shuffle helper
        function shuffle(array) {
            return array.slice().sort(() => Math.random() - 0.5);
        }

        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            score = 0;
            currentRound = 0;
            document.getElementById('score').innerText = score;
            setupRound();
        }

        function restartGame() {
            document.getElementById('gameover-modal').classList.add('hidden');
            startGame();
        }

        function setupRound() {
            // Clear previous state
            const container = document.getElementById('game-container');
            document.querySelectorAll('.bubble').forEach(b => b.remove());
            activeBubbles = [];
            
            if (currentRound >= gameData.length) {
                // Game End
                document.getElementById('final-score').innerText = score;
                document.getElementById('gameover-modal').classList.remove('hidden');
                return;
            }

            currentTargetData = gameData[currentRound];
            document.getElementById('round-num').innerText = currentRound + 1;
            document.getElementById('target-word').innerText = currentTargetData.classifier;

            // Pick 5 target items out of 10
            const correctPool = shuffle(currentTargetData.items);
            const targets = correctPool.slice(0, 5).map(text => ({ text, isTarget: true }));

            // Gather distractors from all other categories
            let distractorPool = [];
            gameData.forEach((data, index) => {
                if (index !== currentRound) {
                    distractorPool = distractorPool.concat(data.items);
                }
            });
            const distractors = shuffle(distractorPool).slice(0, 10).map(text => ({ text, isTarget: false }));

            // Combine and shuffle to make 15 total items
            const roundItems = shuffle([...targets, ...distractors]);
            targetsRemaining = 5;

            // Create Bubble Objects
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            roundItems.forEach((item) => {
                const bubbleEl = document.createElement('div');
                bubbleEl.className = 'bubble';
                bubbleEl.innerText = item.text;

                // Initial Random Positions
                const radius = 42.5;
                let x = Math.random() * (containerWidth - radius * 2) + radius;
                let y = Math.random() * (containerHeight - radius * 2 - 150) + radius + 130; // Avoid overlapping big top bubble

                bubbleEl.style.left = `${x - radius}px`;
                bubbleEl.style.top = `${y - radius}px`;

                container.appendChild(bubbleEl);

                const bubbleObj = {
                    element: bubbleEl,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: radius,
                    isTarget: item.isTarget,
                    popped: false
                };

                bubbleEl.addEventListener('pointerdown', () => popBubble(bubbleObj));
                activeBubbles.push(bubbleObj);
            });

            // Start Timer and Physics Animation
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            updatePhysics();
        }

        function popBubble(bubbleObj) {
            if (bubbleObj.popped) return;

            bubbleObj.popped = true;
            bubbleObj.element.classList.add('pop');

            if (bubbleObj.isTarget) {
                playSound('pop');
                score += 10;
                targetsRemaining--;
                document.getElementById('score').innerText = score;

                if (targetsRemaining === 0) {
                    endRound();
                }
            } else {
                playSound('wrong');
                score = Math.max(0, score - 5);
                document.getElementById('score').innerText = score;
            }
        }

        function updateTimer() {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endRound();
            }
        }

        function updatePhysics() {
            const container = document.getElementById('game-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            activeBubbles.forEach(b => {
                if (b.popped) return;

                // Move
                b.x += b.vx;
                b.y += b.vy;

                // Boundaries collision
                if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -1; }
                if (b.x + b.radius > width) { b.x = width - b.radius; b.vx *= -1; }
                if (b.y - b.radius < 120) { b.y = 120 + b.radius; b.vy *= -1; } // Keep space below top UI
                if (b.y + b.radius > height) { b.y = height - b.radius; b.vy *= -1; }

                // Apply styles
                b.element.style.left = `${b.x - b.radius}px`;
                b.element.style.top = `${b.y - b.radius}px`;
            });

            animationFrameId = requestAnimationFrame(updatePhysics);
        }

        function endRound() {
            clearInterval(timerInterval);
            cancelAnimationFrame(animationFrameId);

            // Populate Summary Modal
            const summaryList = document.getElementById('summary-list');
            summaryList.innerHTML = '';
            
            document.getElementById('summary-target').innerText = currentTargetData.classifier;
            currentTargetData.items.forEach(item => {
                const tag = document.createElement('div');
                tag.className = 'summary-tag';
                tag.innerText = item;
                summaryList.appendChild(tag);
            });

            document.getElementById('summary-modal').classList.remove('hidden');
        }

        function nextRound() {
            document.getElementById('summary-modal').classList.add('hidden');
            currentRound++;
            setupRound();
        }
    </script>
</body>
</html>
